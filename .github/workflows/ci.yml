name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - name: Generate reproducible engineering validation
        if: matrix.python-version == '3.12'
        run: distilltwin-validate --output validation-report
      - name: Upload validation evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: distilltwin-validation-report
          path: validation-report/
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: distilltwin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test containerized API
        run: |
          docker run --detach --name distilltwin-ci --publish 8000:8000 distilltwin:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs distilltwin-ci
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm --force distilltwin-ci || true
