[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distilltwin"
version = "0.1.0"
description = "An open, control-oriented distillation digital twin with an Aspen integration path."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Muhammad Jaffri"}]
dependencies = [
  "fastapi>=0.110,<1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pydantic>=2.6,<3",
  "streamlit>=1.35,<2",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.10,<3",
  "pandas-stubs>=2.1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[project.scripts]
distilltwin = "distilltwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
packages = ["distilltwin"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=distilltwin --cov-report=term-missing"
testpaths = ["tests"]
